version: '3.8'

services:
  nbti:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NBTI_ADMIN_TOKEN=${NBTI_ADMIN_TOKEN:-}
      - NBTI_API_KEY_LONGCAT=${NBTI_API_KEY_LONGCAT:-}
      - NBTI_API_KEY_DEEPSEEK_V4_FLASH=${NBTI_API_KEY_DEEPSEEK_V4_FLASH:-}
      - NBTI_API_KEY_DOUBAO=${NBTI_API_KEY_DOUBAO:-}
      - NBTI_API_KEY_LM_STUDIO=${NBTI_API_KEY_LM_STUDIO:-lm-studio}
      # 存储后端透传（默认 file 单机行为不变）；设为 redis 时需同时提供 NBTI_REDIS_URL 并安装 redis 包
      - NBTI_STORAGE_BACKEND=${NBTI_STORAGE_BACKEND:-file}
      - NBTI_REDIS_URL=${NBTI_REDIS_URL:-}
      # gunicorn worker 数（默认 1）；>1 需先启用 Redis 存储后端，否则文件后端会因多进程竞争丢数据
      - NBTI_WORKERS=${NBTI_WORKERS:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8081/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
