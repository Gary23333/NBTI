<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>NBTI · 人格测试宇宙</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener('load', function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.register('/sw.js').catch(function (err) {
      console.warn('ServiceWorker 注册失败', err);
    });
  } catch (e) {
    console.warn('ServiceWorker 注册失败', e);
  }
});
</script>
</head>
<body>

<div class="app-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="container">
  <header class="header">
    <div class="header-glow"></div>
    <h1 class="logo-text">NBTI</h1>
    <p class="tagline">人格测试宇宙 · 不止职场</p>
  </header>

  <button class="theme-toggle" id="theme-toggle" title="切换主题">
    <span class="theme-icon" id="theme-icon">🌙</span>
  </button>

  <div class="progress-stepper" id="progress-stepper" style="display:none;">
    <div class="step active" data-step="1">
      <div class="step-dot">1</div>
      <div class="step-label">主题</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-step="2">
      <div class="step-dot">2</div>
      <div class="step-label">风格</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-step="3">
      <div class="step-dot">3</div>
      <div class="step-label">测试</div>
    </div>
  </div>

  <div class="page active" id="page-welcome">
    <div class="welcome-flow">
      <div class="welcome-step active" id="step-theme">
        <div class="step-header">
          <div class="step-emoji">🎯</div>
          <h2>选择测试主题</h2>
          <p class="step-desc">你想探索哪个维度的自己？</p>
        </div>
        <div class="theme-grid" id="theme-grid">
          <div class="loading-skeleton">
            <div class="spinner-lg"></div>
            <p>加载主题中...</p>
          </div>
        </div>
      </div>

      <div class="welcome-step" id="step-style">
        <div class="step-header">
          <div class="step-emoji">✨</div>
          <h2>选择吐槽风格</h2>
          <p class="step-desc">你想被怎样"解读"？</p>
        </div>
        <div class="style-grid" id="style-grid">
        </div>
        <div class="step-nav">
          <button class="btn btn-ghost" onclick="goBackToTheme()">
            ← 返回
          </button>
        </div>
      </div>

      <div class="welcome-step" id="step-ready">
        <div class="step-header ready-header">
          <div class="ready-emoji" id="ready-emoji">🚀</div>
          <h2 id="ready-title">准备就绪</h2>
          <div class="ready-selection">
            <div class="selection-badge" id="selected-theme-badge"></div>
            <div class="selection-arrow">→</div>
            <div class="selection-badge style-badge" id="selected-style-badge"></div>
          </div>
          <p class="step-desc">准备好接受灵魂拷问了吗？</p>
        </div>
        <div class="ready-features">
          <div class="feature-item">
            <span class="feature-icon">⚡</span>
            <span>约20道题</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🎭</span>
            <span>专属人格画像</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">📊</span>
            <span>雷达维度分析</span>
          </div>
        </div>
        <div class="ready-actions">
          <button class="btn btn-ghost" onclick="goBackToStyle()">
            ← 重选风格
          </button>
          <button class="btn btn-primary btn-glow" onclick="startTest()">
            开始测试 →
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="page" id="page-test">
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progress-text">第 0 题</div>
    </div>

    <div id="question-area">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 12px;">正在加载...</p>
      </div>
    </div>
  </div>

  <div class="page" id="page-result">
    <div class="result" id="result-area">
    </div>
  </div>

  <footer class="footer">
    <p>由 <a href="#">NBTI</a> 提供 · 人格测试宇宙</p>
  </footer>
</div>

<script src="avatar-generator.js"></script>
<script src="radar-chart.js"></script>
<script src="share-poster.js"></script>
<script src="app.js"></script>

</body>
</html>
