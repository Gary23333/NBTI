<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBTI 人格报告</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="stylesheet" href="/style.css">
<style>
  /* 分享页专属样式（配色全部复用 style.css 主题变量） */
  .share-brand {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .share-brand-logo {
    font-size: 1.2rem;
    font-weight: 800;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .share-brand-btn {
    padding: 8px 22px;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .share-pre {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .share-error {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 20px;
    padding: 60px 20px;
  }
  .share-error .emoji { font-size: 4rem; }
  .share-error h2 { font-size: 1.5rem; font-weight: 700; }
  .share-error p { color: var(--text-dim); max-width: 360px; }
  .share-error .btn { text-decoration: none; }

  /* ---- 好友合盘区（配色复用主题变量，深浅主题自适应） ---- */
  .compat-wrap { max-width: 600px; margin: 0 auto; padding: 8px 20px 48px; }
  .compat-heading { text-align: center; font-size: 1.5rem; font-weight: 800; margin: 24px 0 8px; }
  .compat-guide { text-align: center; color: var(--text-dim); margin: 0 0 20px; font-size: 0.95rem; }
  .compat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .compat-sides { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .compat-side { flex: 1; text-align: center; min-width: 0; }
  .compat-side-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
  .compat-chip { display: inline-flex; flex-direction: column; gap: 2px; padding: 10px 18px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; }
  .compat-chip-code { font-weight: 800; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
  .compat-chip-name { font-size: 0.85rem; color: var(--text-dim); }
  .compat-vs { font-weight: 800; font-size: 1.2rem; color: var(--accent); flex-shrink: 0; }
  .compat-selects { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .compat-selects select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px; font-size: 0.9rem; }
  .compat-selects select:focus { border-color: var(--accent); outline: none; }
  .compat-go { display: block; margin: 16px auto 0; }
  .compat-result { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; text-align: center; }
  .compat-ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 12px; }
  .compat-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 800; color: var(--accent); }
  .compat-title { font-size: 1.3rem; font-weight: 800; margin: 4px 0 10px; }
  .compat-verdict { color: var(--text-dim); line-height: 1.7; max-width: 440px; margin: 0 auto 16px; font-size: 0.95rem; }
  .compat-dims { text-align: left; display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .compat-dim { border-top: 1px dashed var(--border); padding-top: 10px; }
  .compat-dim-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
  .compat-rel { font-weight: 700; padding: 1px 10px; border-radius: 999px; font-size: 0.75rem; }
  .compat-rel-same { color: var(--accent3); border: 1px solid var(--accent3); }
  .compat-rel-comp { color: var(--accent2); border: 1px solid var(--accent2); }
  .compat-rel-clash { color: var(--accent4); border: 1px solid var(--accent4); }
  .compat-dim-comment { font-size: 0.9rem; }
  .compat-hint { color: var(--text-dim); }
</style>
<script>
/* 提前应用主题（与主站 localStorage 键一致），避免页面闪烁 */
(function () {
  var stored = null;
  try { stored = localStorage.getItem('nbti-theme'); } catch (e) {}
  var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

<div class="share-brand">
  <a class="share-brand-logo" href="/">NBTI · 牛比体</a>
  <a class="btn btn-primary share-brand-btn" href="/">我也要测</a>
</div>

<div class="container">
  <!-- 加载中 -->
  <div class="loading" id="share-loading">
    <div class="spinner"></div>
    <p style="margin-top: 12px;">正在加载人格报告...</p>
  </div>

  <!-- 结果内容（渲染逻辑全部使用 textContent，防 XSS） -->
  <div class="result" id="share-result" hidden></div>

  <!-- 404 / 加载失败 -->
  <div class="share-error" id="share-error" hidden>
    <div class="emoji">🥲</div>
    <h2>链接已过期或不存在</h2>
    <p>这份人格报告可能已被清理，或者链接有误。</p>
    <a class="btn btn-primary" href="/">去测一个 →</a>
  </div>

  <footer class="footer">
    <p>由 <a href="/">NBTI</a> 提供 · 专治各种职场不服</p>
  </footer>
</div>

<!-- 好友合盘功能区（由下方 NBTICompatUI 渲染） -->
<div id="compat-zone"></div>

<script src="/avatar-generator.js"></script>
<script src="/radar-chart.js"></script>
<script src="/compat-data.js"></script>
<script src="/share-poster.js"></script>
<script>
(function () {
  var match = location.pathname.match(/^\/share\/([A-Za-z0-9_-]{1,64})$/);
  var loadingEl = document.getElementById('share-loading');
  var resultEl = document.getElementById('share-result');
  var errorEl = document.getElementById('share-error');

  function showError() {
    loadingEl.hidden = true;
    resultEl.hidden = true;
    errorEl.hidden = false;
  }

  if (!match) {
    showError();
    return;
  }

  /* 创建元素并写入纯文本（快照 JSON 是用户可控输入，一律 textContent，绝不用 innerHTML 直插） */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function render(snapshot) {
    var result = snapshot.result || {};
    var scores = snapshot.scores || {};

    // 头像类型仅允许安全字符集（生成器内部也会转义，双保险），异常回退 NBTI
    var type = String(result.type || '');
    if (!/^[A-Za-z0-9_]{1,16}$/.test(type)) type = 'NBTI';

    // 头像（200×200 圆角容器，样式与主站结果页一致）
    var avatarBox = el('div', 'avatar-container');
    avatarBox.id = 'share-avatar';
    avatarBox.style.cssText = 'width:200px;height:200px;margin:0 auto;border-radius:12px;overflow:hidden;border:4px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,0.3);';
    if (window.NBTIAvatar) {
      // 生成器输出的是自包含 SVG 字符串（内部已转义），插入方式与主站一致
      avatarBox.innerHTML = window.NBTIAvatar.generateSvgAvatar(type);
    } else {
      avatarBox.textContent = '头像生成器加载失败';
    }
    resultEl.appendChild(avatarBox);

    // 类型代码 / 名称 / 一句话评语
    resultEl.appendChild(el('div', 'code', String(result.type || 'UNKNOWN')));
    resultEl.appendChild(el('h2', null, String(result.name || '未知人格')));
    resultEl.appendChild(el('div', 'oneline', '"' + String(result.oneline || '') + '"'));

    // 名场面 / 适配岗位 / 翻车场景
    [['🎬 名场面', result.scene], ['🎯 适配岗位', result.adapt], ['⚠️ 翻车场景', result.crash]].forEach(function (pair) {
      if (pair[1]) {
        var row = el('div', 'result-meta');
        row.appendChild(el('span', 'meta-label', pair[0]));
        row.appendChild(el('span', null, String(pair[1])));
        resultEl.appendChild(row);
      }
    });

    // 雷达图（scores 已由后端转 int 并 clamp）
    var radarSection = el('div', 'radar-section');
    radarSection.appendChild(el('h3', null, '📊 维度画像'));
    var radarBox = el('div', 'radar-chart');
    radarBox.id = 'share-radar';
    radarSection.appendChild(radarBox);
    resultEl.appendChild(radarSection);
    if (window.NBTIRadar) {
      window.NBTIRadar.renderRadar(radarBox, scores);
    }

    // 报告区块：毒舌解读 / 伪科学分析 / closing（多行文本用 pre-wrap 保留换行）
    var report = el('div', 'report');
    var hasReport = false;
    [['🔍 毒舌解读', result.interpretation], ['🧪 伪科学分析', result.pseudo_science]].forEach(function (pair) {
      if (pair[1]) {
        hasReport = true;
        var sec = el('div', 'report-section');
        sec.appendChild(el('h3', null, pair[0]));
        sec.appendChild(el('p', 'share-pre', String(pair[1])));
        report.appendChild(sec);
      }
    });
    if (result.closing) {
      hasReport = true;
      var sec = el('div', 'report-section closing');
      sec.appendChild(el('p', 'share-pre', String(result.closing)));
      report.appendChild(sec);
    }
    if (hasReport) resultEl.appendChild(report);

    // 页面标题：<name> 的 NBTI 人格报告
    document.title = (result.name ? String(result.name) : '神秘人') + ' 的 NBTI 人格报告';

    loadingEl.hidden = true;
    resultEl.hidden = false;
  }

  fetch('/api/share/' + encodeURIComponent(match[1]))
    .then(function (resp) {
      if (!resp.ok) throw new Error('share not found');
      return resp.json();
    })
    .then(function (snapshot) {
      if (!snapshot || typeof snapshot !== 'object' || typeof snapshot.result !== 'object') {
        throw new Error('bad snapshot');
      }
      render(snapshot);
      if (window.NBTICompatUI) window.NBTICompatUI.init(snapshot.result);
    })
    .catch(showError);
})();
</script>

<script>
/* 好友合盘区：在 #compat-zone 内渲染（全部 textContent / setAttribute，防 XSS） */
(function () {
  // 4 个下拉防呆选择器：默认各选第一个（NBTI）
  var DIM_OPTIONS = [
    [{ v: 'N', t: 'N · 能动' }, { v: 'S', t: 'S · 稳态' }],
    [{ v: 'B', t: 'B · 边界' }, { v: 'H', t: 'H · 合群' }],
    [{ v: 'T', t: 'T · 理性' }, { v: 'F', t: 'F · 感性' }],
    [{ v: 'I', t: 'I · 执行' }, { v: 'P', t: 'P · 灵活' }]
  ];

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function svgEl(tag, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  // 合拍指数环形图（纯 SVG，score 为 0-100 数字）
  function buildRing(score) {
    var R = 60;
    var C = 2 * Math.PI * R;
    var wrap = el('div', 'compat-ring-wrap');
    var svg = svgEl('svg', { width: 140, height: 140, viewBox: '0 0 140 140' });
    svg.appendChild(svgEl('circle', { cx: 70, cy: 70, r: R, fill: 'none', stroke: 'var(--border)', 'stroke-width': 10 }));
    svg.appendChild(svgEl('circle', {
      cx: 70, cy: 70, r: R, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 10,
      'stroke-linecap': 'round',
      'stroke-dasharray': C.toFixed(2),
      'stroke-dashoffset': (C * (1 - Math.max(0, Math.min(100, score)) / 100)).toFixed(2),
      transform: 'rotate(-90 70 70)'
    }));
    wrap.appendChild(svg);
    wrap.appendChild(el('div', 'compat-ring-num', String(score) + '%'));
    return wrap;
  }

  var REL_CLASS = { '同频': 'compat-rel compat-rel-same', '互补': 'compat-rel compat-rel-comp', '互斥': 'compat-rel compat-rel-clash' };

  function init(result) {
    var zone = document.getElementById('compat-zone');
    if (!zone || !window.NBTICompat) return;

    // 与上方头像渲染同款校验：仅允许安全字符集
    var mineType = String(result.type || '');
    if (!/^[A-Za-z0-9_]{1,16}$/.test(mineType)) return;
    var mineName = String(result.name || mineType);

    var wrap = el('div', 'compat-wrap');
    wrap.appendChild(el('h2', 'compat-heading', '💞 测测我们合不合'));
    wrap.appendChild(el('p', 'compat-guide', '把链接甩给 TA，测完回来合盘'));

    var panel = el('div', 'compat-panel');
    var sides = el('div', 'compat-sides');

    // 我方类型（只读展示）
    var mineSide = el('div', 'compat-side');
    mineSide.appendChild(el('div', 'compat-side-label', '你的类型'));
    var chip = el('div', 'compat-chip');
    chip.appendChild(el('span', 'compat-chip-code', mineType));
    chip.appendChild(el('span', 'compat-chip-name', mineName));
    mineSide.appendChild(chip);
    sides.appendChild(mineSide);

    sides.appendChild(el('div', 'compat-vs', 'VS'));

    // TA 的类型（下拉选择器）
    var theirSide = el('div', 'compat-side');
    theirSide.appendChild(el('div', 'compat-side-label', 'TA 的类型'));
    var selectsBox = el('div', 'compat-selects');
    var selects = DIM_OPTIONS.map(function (opts) {
      var sel = document.createElement('select');
      opts.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.v;
        opt.textContent = o.t;
        sel.appendChild(opt);
      });
      selectsBox.appendChild(sel);
      return sel;
    });
    theirSide.appendChild(selectsBox);
    sides.appendChild(theirSide);
    panel.appendChild(sides);

    var goBtn = el('button', 'btn btn-primary compat-go', '开始合盘');
    panel.appendChild(goBtn);
    wrap.appendChild(panel);

    var card = el('div', 'compat-result');
    card.hidden = true;
    wrap.appendChild(card);
    zone.appendChild(wrap);

    var lastCompat = null;
    var lastTheirType = null;

    goBtn.addEventListener('click', function () {
      lastTheirType = selects.map(function (s) { return s.value; }).join('');
      lastCompat = window.NBTICompat.getCompat(mineType, lastTheirType);
      renderCard();
    });

    function renderCard() {
      while (card.firstChild) card.removeChild(card.firstChild);
      var compat = lastCompat;
      if (!compat) {
        card.appendChild(el('p', 'compat-hint', '你的类型太神秘，五行之外都算不到，建议重测一个。'));
        card.hidden = false;
        return;
      }
      if (typeof compat.score === 'number') card.appendChild(buildRing(compat.score));
      card.appendChild(el('div', 'compat-title', compat.title));
      card.appendChild(el('p', 'compat-verdict', compat.verdict));

      if (compat.dims && compat.dims.length) {
        var dimsBox = el('div', 'compat-dims');
        compat.dims.forEach(function (d) {
          var row = el('div', 'compat-dim');
          var head = el('div', 'compat-dim-head');
          head.appendChild(el('span', null, d.label));
          head.appendChild(el('span', REL_CLASS[d.relation] || 'compat-rel', d.relation));
          row.appendChild(head);
          row.appendChild(el('div', 'compat-dim-comment', d.comment));
          dimsBox.appendChild(row);
        });
        card.appendChild(dimsBox);
      }

      // 合拍海报按钮
      if (window.NBTIPoster && typeof window.NBTIPoster.downloadCompat === 'function') {
        var posterBtn = el('button', 'btn btn-primary compat-poster', '📮 生成合拍海报');
        posterBtn.addEventListener('click', function () {
          if (!lastCompat) return;
          posterBtn.disabled = true;
          posterBtn.textContent = '生成中…';
          Promise.resolve(window.NBTIPoster.downloadCompat(
            { type: mineType, name: mineName },
            { type: lastTheirType },
            lastCompat
          )).then(function () {
            posterBtn.disabled = false;
            posterBtn.textContent = '📮 生成合拍海报';
          }, function () {
            posterBtn.disabled = false;
            posterBtn.textContent = '📮 生成合拍海报';
          });
        });
        card.appendChild(posterBtn);
      }

      card.hidden = false;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  window.NBTICompatUI = { init: init };
})();
</script>

</body>
</html>
