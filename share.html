<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NBTI 人格报告</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    background: var(--bg-primary);
  }
  .app-bg-share {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg-primary);
  }
  .blob-share {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: blobFloat 20s ease-in-out infinite;
  }
  [data-theme="light"] .blob-share { opacity: 0.2; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) .blob-share { opacity: 0.2; }
  }
  .blob-share-1 { width: 350px; height: 350px; background: var(--accent-violet); top: -80px; left: -80px; }
  .blob-share-2 { width: 300px; height: 300px; background: var(--accent-pink); top: 35%; right: -60px; animation-delay: -7s; }
  .blob-share-3 { width: 250px; height: 250px; background: var(--accent-cyan); bottom: -40px; left: 25%; animation-delay: -14s; }

  .share-brand {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface-glass);
    backdrop-filter: var(--blur-md);
    -webkit-backdrop-filter: var(--blur-md);
    border-bottom: 1px solid var(--border-glass);
  }
  .share-brand-logo {
    font-size: 1.25rem;
    font-weight: 900;
    text-decoration: none;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  .share-brand-btn {
    padding: 10px 24px;
    font-size: 0.9rem;
  }
  .share-pre {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .share-error {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 20px;
    padding: 60px 20px;
  }
  .share-error .emoji { font-size: 4rem; animation: floatPulse 2s ease-in-out infinite; }
  .share-error h2 { font-size: 1.5rem; font-weight: 800; }
  .share-error p { color: var(--text-secondary); max-width: 360px; line-height: 1.7; }
  .share-error .btn { text-decoration: none; }

  .result .theme-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: var(--surface-glass);
    backdrop-filter: var(--blur-sm);
    -webkit-backdrop-filter: var(--blur-sm);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .share-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .share-actions .btn {
    font-size: 0.9rem;
    padding: 12px 20px;
    min-height: 44px;
  }

  .compat-wrap { max-width: 600px; margin: 0 auto; padding: 8px 20px 60px; }
  .compat-heading {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 900;
    margin: 32px 0 8px;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .compat-guide { text-align: center; color: var(--text-secondary); margin: 0 0 24px; font-size: 0.95rem; }
  .compat-panel {
    background: var(--surface-glass);
    backdrop-filter: var(--blur-lg);
    -webkit-backdrop-filter: var(--blur-lg);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-md);
  }
  .compat-sides { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .compat-side { flex: 1; text-align: center; min-width: 0; }
  .compat-side-label { font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 10px; font-weight: 600; }
  .compat-chip {
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    min-width: 100px;
  }
  .compat-chip-code { font-weight: 900; font-size: 1.15rem; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
  .compat-chip-name { font-size: 0.85rem; color: var(--text-secondary); }
  .compat-vs-heart {
    font-size: 1.8rem;
    flex-shrink: 0;
    animation: heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .compat-selects { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .compat-selects select {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .compat-selects select:focus { border-color: var(--accent-violet); outline: none; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
  .compat-go { display: block; margin: 20px auto 0; }
  .compat-result {
    margin-top: 24px;
    background: var(--surface-glass);
    backdrop-filter: var(--blur-lg);
    -webkit-backdrop-filter: var(--blur-lg);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    text-align: center;
    box-shadow: var(--shadow-md);
    animation: scaleIn 0.4s var(--transition-base);
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .compat-ring-wrap { position: relative; width: 150px; height: 150px; margin: 0 auto 16px; }
  .compat-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .compat-title { font-size: 1.4rem; font-weight: 900; margin: 4px 0 12px; letter-spacing: -0.02em; }
  .compat-verdict { color: var(--text-secondary); line-height: 1.8; max-width: 440px; margin: 0 auto 20px; font-size: 0.95rem; }
  .compat-dims { text-align: left; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .compat-dim { border-top: 1px dashed var(--border-glass); padding-top: 12px; }
  .compat-dim-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-tertiary); margin-bottom: 6px; }
  .compat-rel { font-weight: 700; padding: 3px 12px; border-radius: var(--radius-full); font-size: 0.75rem; }
  .compat-rel-same { color: var(--accent-emerald); background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
  .compat-rel-comp { color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); }
  .compat-rel-clash { color: var(--accent-rose); background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); }
  .compat-dim-comment { font-size: 0.9rem; line-height: 1.6; }
  .compat-hint { color: var(--text-secondary); }
  .compat-preset-tag {
    display: inline-block;
    padding: 4px 12px;
    background: linear-gradient(135deg, rgba(244, 114, 182, 0.15), rgba(139, 92, 246, 0.15));
    border: 1px solid rgba(244, 114, 182, 0.3);
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    color: var(--accent-pink);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .toast-share {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-glass);
    backdrop-filter: var(--blur-lg);
    -webkit-backdrop-filter: var(--blur-lg);
    color: var(--text-primary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    padding: 14px 28px;
    font-size: 0.95rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all var(--transition-base);
    z-index: 1000;
    box-shadow: var(--shadow-lg);
  }
  .toast-share.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem('nbti-theme'); } catch (e) {}
  var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

<div class="app-bg-share">
  <div class="blob-share blob-share-1"></div>
  <div class="blob-share blob-share-2"></div>
  <div class="blob-share blob-share-3"></div>
</div>

<div class="share-brand">
  <a class="share-brand-logo" href="/">NBTI · 人格测试</a>
  <a class="btn btn-primary share-brand-btn" href="/">我也要测 →</a>
</div>

<div class="container">
  <div class="loading" id="share-loading">
    <div class="spinner-lg"></div>
    <p style="margin-top: 16px; color: var(--text-secondary);">正在加载人格报告...</p>
  </div>

  <div class="result" id="share-result" hidden></div>

  <div class="share-error" id="share-error" hidden>
    <div class="emoji">🥲</div>
    <h2>链接已过期或不存在</h2>
    <p>这份人格报告可能已被清理，或者链接有误。来测一个全新的吧！</p>
    <a class="btn btn-primary" href="/">去测一个 →</a>
  </div>

  <footer class="footer">
    <p>由 <a href="/">NBTI</a> 提供 · 人格测试宇宙</p>
  </footer>
</div>

<div id="compat-zone"></div>
<div class="toast-share" id="share-toast"></div>

<script src="/avatar-generator.js"></script>
<script src="/radar-chart.js"></script>
<script src="/compat-data.js"></script>
<script src="/share-poster.js"></script>
<script>
(function () {
  var match = location.pathname.match(/^\/share\/([A-Za-z0-9_-]{1,64})$/);
  var loadingEl = document.getElementById('share-loading');
  var resultEl = document.getElementById('share-result');
  var errorEl = document.getElementById('share-error');
  var toastEl = document.getElementById('share-toast');
  var toastTimer = null;
  var currentSnapshot = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
  }

  function showError() {
    loadingEl.hidden = true;
    resultEl.hidden = true;
    errorEl.hidden = false;
  }

  if (!match) {
    showError();
    return;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  function render(snapshot) {
    currentSnapshot = snapshot;
    var result = snapshot.result || {};
    var scores = snapshot.scores || {};
    var theme = snapshot.theme || 'workplace';
    var themeInfo = snapshot.theme_info || null;

    var type = String(result.type || '');
    if (!/^[A-Za-z0-9_]{1,16}$/.test(type)) type = 'NBTI';

    if (themeInfo) {
      var badge = el('div', 'theme-badge');
      badge.innerHTML = themeInfo.icon + ' ' + themeInfo.name;
      resultEl.appendChild(badge);
    }

    var avatarBox = el('div', 'avatar-container');
    avatarBox.id = 'share-avatar';
    if (window.NBTIAvatar) {
      avatarBox.innerHTML = window.NBTIAvatar.generateSvgAvatar(type);
    } else {
      avatarBox.textContent = '头像生成器加载失败';
    }
    resultEl.appendChild(avatarBox);

    resultEl.appendChild(el('div', 'code', String(result.type || 'UNKNOWN')));
    resultEl.appendChild(el('h2', null, String(result.name || '未知人格')));
    resultEl.appendChild(el('div', 'oneline', '"' + String(result.oneline || '') + '"'));

    [['🎬 名场面', result.scene], ['🎯 适配', result.adapt], ['⚠️ 翻车', result.crash]].forEach(function (pair) {
      if (pair[1]) {
        var row = el('div', 'result-meta');
        row.appendChild(el('span', 'meta-label', pair[0]));
        row.appendChild(el('span', null, String(pair[1])));
        resultEl.appendChild(row);
      }
    });

    var radarSection = el('div', 'radar-section');
    radarSection.appendChild(el('h3', null, '📊 维度画像'));
    var radarBox = el('div', 'radar-chart');
    radarBox.id = 'share-radar';
    radarSection.appendChild(radarBox);
    resultEl.appendChild(radarSection);
    if (window.NBTIRadar) {
      window.NBTIRadar.renderRadar(radarBox, scores);
    }

    var report = el('div', 'report');
    var hasReport = false;
    [['🔍 毒舌解读', result.interpretation], ['🧪 伪科学分析', result.pseudo_science]].forEach(function (pair) {
      if (pair[1]) {
        hasReport = true;
        var sec = el('div', 'report-section');
        sec.appendChild(el('h3', null, pair[0]));
        sec.appendChild(el('p', 'share-pre', String(pair[1])));
        report.appendChild(sec);
      }
    });
    if (result.closing) {
      hasReport = true;
      var sec = el('div', 'report-section closing');
      sec.appendChild(el('p', 'share-pre', String(result.closing)));
      report.appendChild(sec);
    }
    if (hasReport) resultEl.appendChild(report);

    var actions = el('div', 'share-actions');

    var posterBtn = el('button', 'btn btn-primary', '📮 生成海报');
    posterBtn.addEventListener('click', async function () {
      if (!window.NBTIPoster) return;
      posterBtn.disabled = true;
      var origText = posterBtn.textContent;
      posterBtn.textContent = '生成中…';
      try {
        var canvas = await window.NBTIPoster.generate(result, scores, {
          theme: theme,
          themeInfo: themeInfo,
          slogan: themeInfo ? themeInfo.name : '人格测试'
        });
        var modal = document.getElementById('share-poster-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'share-poster-modal';
          modal.className = 'poster-modal';
          modal.innerHTML = '<div class="poster-modal-inner"><img alt="分享海报"><p class="poster-modal-hint">长按图片可保存到相册</p><div class="poster-modal-actions"><button class="btn btn-primary" id="share-poster-download">📥 下载 PNG</button><button class="btn btn-outline" id="share-poster-close">关闭</button></div></div>';
          document.body.appendChild(modal);
          modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });
          modal.querySelector('#share-poster-close').addEventListener('click', function () { modal.classList.remove('open'); });
          modal.querySelector('#share-poster-download').addEventListener('click', function () {
            window.NBTIPoster.download(result, scores, { theme: theme, themeInfo: themeInfo });
          });
        }
        modal.querySelector('img').src = canvas.toDataURL('image/png');
        modal.classList.add('open');
      } catch (e) {
        showToast('海报生成失败，请重试');
      } finally {
        posterBtn.disabled = false;
        posterBtn.textContent = origText;
      }
    });
    actions.appendChild(posterBtn);

    var copyBtn = el('button', 'btn btn-outline', '📋 复制文案');
    copyBtn.addEventListener('click', async function () {
      if (!window.NBTIPoster) return;
      var themeName = themeInfo ? themeInfo.name.replace('人格', '') : 'NBTI';
      var hashtags = theme === 'animal' ? ['#动物人格', '#人格测试', '#NBTI'] : ['#人格测试', '#NBTI', '#职场人格'];
      var text = window.NBTIPoster.generateCopyText(result, themeName, hashtags);
      try {
        await copyText(text);
        showToast('文案已复制，快去发朋友圈！');
      } catch (e) {
        showToast('复制失败，请手动复制');
      }
    });
    actions.appendChild(copyBtn);

    var restartBtn = el('a', 'btn btn-outline', '🔄 我也要测');
    restartBtn.href = '/';
    actions.appendChild(restartBtn);

    resultEl.appendChild(actions);

    var shareTitle = (result.name ? String(result.name) : '神秘人') + ' 的 NBTI 人格报告';
    document.title = shareTitle;

    loadingEl.hidden = true;
    resultEl.hidden = false;
  }

  fetch('/api/share/' + encodeURIComponent(match[1]))
    .then(function (resp) {
      if (!resp.ok) throw new Error('share not found');
      return resp.json();
    })
    .then(function (snapshot) {
      if (!snapshot || typeof snapshot !== 'object' || typeof snapshot.result !== 'object') {
        throw new Error('bad snapshot');
      }
      render(snapshot);
      if (window.NBTICompatUI) window.NBTICompatUI.init(snapshot.result, snapshot.theme);
    })
    .catch(showError);
})();
</script>

<script>
(function () {
  var DIM_OPTIONS = [
    [{ v: 'N', t: 'N' }, { v: 'S', t: 'S' }],
    [{ v: 'B', t: 'B' }, { v: 'H', t: 'H' }],
    [{ v: 'T', t: 'T' }, { v: 'F', t: 'F' }],
    [{ v: 'I', t: 'I' }, { v: 'P', t: 'P' }]
  ];

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function svgEl(tag, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function buildRing(score) {
    var R = 65;
    var C = 2 * Math.PI * R;
    var wrap = el('div', 'compat-ring-wrap');
    var svg = svgEl('svg', { width: 150, height: 150, viewBox: '0 0 150 150' });
    svg.appendChild(svgEl('circle', { cx: 75, cy: 75, r: R, fill: 'none', stroke: 'var(--border-glass)', 'stroke-width': 10 }));
    var offset = C * (1 - Math.max(0, Math.min(100, score)) / 100);
    var progressCircle = svgEl('circle', {
      cx: 75, cy: 75, r: R, fill: 'none', stroke: 'url(#compatGrad)', 'stroke-width': 10,
      'stroke-linecap': 'round',
      'stroke-dasharray': C.toFixed(2),
      'stroke-dashoffset': offset.toFixed(2),
      transform: 'rotate(-90 75 75)'
    });
    var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    var grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
    grad.setAttribute('id', 'compatGrad');
    grad.setAttribute('x1', '0%'); grad.setAttribute('y1', '0%');
    grad.setAttribute('x2', '100%'); grad.setAttribute('y2', '100%');
    var stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop1.setAttribute('offset', '0%'); stop1.setAttribute('stop-color', '#8b5cf6');
    var stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop2.setAttribute('offset', '100%'); stop2.setAttribute('stop-color', '#ec4899');
    grad.appendChild(stop1); grad.appendChild(stop2); defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(progressCircle);
    wrap.appendChild(svg);
    wrap.appendChild(el('div', 'compat-ring-num', String(score) + '%'));
    return wrap;
  }

  var REL_CLASS = { '同频': 'compat-rel compat-rel-same', '互补': 'compat-rel compat-rel-comp', '互斥': 'compat-rel compat-rel-clash' };

  function init(result, theme) {
    var zone = document.getElementById('compat-zone');
    if (!zone || !window.NBTICompat) return;

    var category = theme === 'animal' ? 'animal' : 'workplace';
    var mineType = String(result.type || '');
    if (!/^[A-Za-z0-9_]{1,16}$/.test(mineType)) return;
    var typeInfo = window.NBTICompat.getTypeInfo(mineType, category);
    var mineName = typeInfo.name || String(result.name || mineType);

    var wrap = el('div', 'compat-wrap');
    wrap.appendChild(el('h2', 'compat-heading', '💞 测测我们合不合'));
    wrap.appendChild(el('p', 'compat-guide', category === 'animal' ? '选TA的动物人格，看看你们是不是天生一对' : '把链接甩给TA，测完回来合盘'));

    var panel = el('div', 'compat-panel');
    var sides = el('div', 'compat-sides');

    var mineSide = el('div', 'compat-side');
    mineSide.appendChild(el('div', 'compat-side-label', '你的类型'));
    var chip = el('div', 'compat-chip');
    chip.appendChild(el('span', 'compat-chip-code', mineType));
    chip.appendChild(el('span', 'compat-chip-name', mineName));
    mineSide.appendChild(chip);
    sides.appendChild(mineSide);

    sides.appendChild(el('div', 'compat-vs-heart', '❤'));

    var theirSide = el('div', 'compat-side');
    theirSide.appendChild(el('div', 'compat-side-label', 'TA 的类型'));
    var selectsBox = el('div', 'compat-selects');
    var selects = DIM_OPTIONS.map(function (opts) {
      var sel = document.createElement('select');
      opts.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.v;
        opt.textContent = o.t;
        sel.appendChild(opt);
      });
      selectsBox.appendChild(sel);
      return sel;
    });
    theirSide.appendChild(selectsBox);
    sides.appendChild(theirSide);
    panel.appendChild(sides);

    var goBtn = el('button', 'btn btn-primary compat-go', '开始合盘 💘');
    panel.appendChild(goBtn);
    wrap.appendChild(panel);

    var card = el('div', 'compat-result');
    card.hidden = true;
    wrap.appendChild(card);
    zone.appendChild(wrap);

    var lastCompat = null;
    var lastTheirType = null;

    goBtn.addEventListener('click', function () {
      lastTheirType = selects.map(function (s) { return s.value; }).join('');
      lastCompat = window.NBTICompat.getCompat(mineType, lastTheirType, { category: category });
      renderCard();
    });

    function renderCard() {
      while (card.firstChild) card.removeChild(card.firstChild);
      var compat = lastCompat;
      if (!compat) {
        card.appendChild(el('p', 'compat-hint', '你们的类型太神秘，五行之外都算不到...'));
        card.hidden = false;
        return;
      }
      if (compat.isPreset) {
        card.appendChild(el('div', 'compat-preset-tag', '✨ 热门CP组合'));
      }
      if (typeof compat.score === 'number') card.appendChild(buildRing(compat.score));
      card.appendChild(el('div', 'compat-title', compat.title));
      card.appendChild(el('p', 'compat-verdict', compat.verdict));

      if (compat.dims && compat.dims.length) {
        var dimsBox = el('div', 'compat-dims');
        compat.dims.forEach(function (d) {
          var row = el('div', 'compat-dim');
          var head = el('div', 'compat-dim-head');
          head.appendChild(el('span', null, d.label));
          head.appendChild(el('span', REL_CLASS[d.relation] || 'compat-rel', d.relation));
          row.appendChild(head);
          row.appendChild(el('div', 'compat-dim-comment', d.comment));
          dimsBox.appendChild(row);
        });
        card.appendChild(dimsBox);
      }

      var btnRow = el('div', 'share-actions');

      if (window.NBTIPoster && typeof window.NBTIPoster.downloadCompat === 'function') {
        var posterBtn = el('button', 'btn btn-primary', '📮 生成合拍海报');
        posterBtn.addEventListener('click', function () {
          if (!lastCompat) return;
          posterBtn.disabled = true;
          posterBtn.textContent = '生成中…';
          Promise.resolve(window.NBTIPoster.downloadCompat(
            { type: mineType, name: mineName },
            { type: lastTheirType },
            lastCompat,
            {
              theme: theme,
              themeInfo: null,
              slogan: category === 'animal' ? '动物CP合盘' : '好友合盘'
            }
          )).then(function () {
            posterBtn.disabled = false;
            posterBtn.textContent = '📮 生成合拍海报';
          }, function () {
            posterBtn.disabled = false;
            posterBtn.textContent = '📮 生成合拍海报';
          });
        });
        btnRow.appendChild(posterBtn);
      }

      card.appendChild(btnRow);

      card.hidden = false;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  window.NBTICompatUI = { init: init };
})();
</script>

</body>
</html>
